<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Act 3 House Study</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #c9d3dc; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #1c2430; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; outline: none; }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
      .a3-cross { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px #1c2430; }
      .a3-badge { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.88); padding: 6px 10px; border-radius: 6px; font-size: 13px; }
      .a3-badge .zero { color: #c0182b; font-weight: 800; }
      .a3-hint { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); background: rgba(20,28,40,0.85); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity 0.2s; }
      .a3-hint.show { opacity: 1; }
      .a3-keys { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.8); padding: 4px 10px; border-radius: 6px; font-size: 12px; white-space: nowrap; }
      .a3-measure { position: fixed; z-index: 6; transform: translate(-50%, -130%); background: #1c2430; color: #fff; padding: 4px 8px; border-radius: 5px; font: 13px ui-monospace, monospace; pointer-events: none; display: none; text-align: center; }
      .a3-measure small { opacity: 0.75; font-size: 11px; }
      .a3-panel { position: absolute; display: none; margin: 0; background: rgba(20,28,40,0.9); color: #e8eef4; padding: 10px 12px; border-radius: 6px; font: 12px/1.4 ui-monospace, monospace; white-space: pre; overflow: auto; }
      .a3-panel.show { display: block; }
      .a3-audit { top: 48px; left: 10px; max-height: calc(100vh - 100px); max-width: calc(100vw - 20px); }
      .a3-stats { top: 10px; right: 10px; }
      #a3-start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(28,36,48,0.55); color: #fff; cursor: pointer; text-align: center; }
      #a3-start.hidden { display: none; }
      #a3-start .t { font-size: 34px; font-weight: 800; letter-spacing: 1px; }
      #a3-start .sub { margin-top: 10px; font-size: 16px; }
      #a3-start .warn { margin-top: 18px; font-size: 13px; max-width: 640px; opacity: 0.85; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="a3-start">
      <div class="t">ACT 3 HOUSE STUDY</div>
      <div class="sub">Click to explore</div>
      <div class="warn">A scale study of a fan-remembered house layout. Every dimension carries a source tag; press F10 for the audit. Nothing here is measured yet, so treat it as a plausible stand-in, not a reconstruction.</div>
    </div>
    <script type="module" src="/src/act3/main.js"></script>
  </body>
</html>
